<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Register - HR Chatbot</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    >

</head>


<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body">

                    <h3 class="text-center">
                        Create Employee Account
                    </h3>


                    {% if error %}

                    <div class="alert alert-danger">
                        {{ error }}
                    </div>

                    {% endif %}


                    <form
                        method="POST"
                        action="{{ url_for('register') }}"
                    >

                        <div class="form-group">

                            <label>
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                minlength="3"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                Employee ID
                            </label>

                            <input
                                type="text"
                                name="employee_id"
                                class="form-control"
                                placeholder="EMP-2026-001"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                minlength="8"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                name="password_confirmation"
                                class="form-control"
                                minlength="8"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-success btn-block"
                        >
                            Register
                        </button>

                    </form>


                    <div class="text-center mt-3">

                        <a href="{{ url_for('login') }}">
                            Already have an account?
                            Login
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
